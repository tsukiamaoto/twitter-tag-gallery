<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 960" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Layer Card Gradients -->
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Component Accents -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .layer-header { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #f1f5f9; }
    .card-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.4; }
    .badge-text { font-family: 'Segoe UI', monospace; font-size: 10px; font-weight: 600; }
    .conn-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Background Canvas -->
  <rect width="1150" height="960" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1150" height="960" fill="url(#grid)" />
  </g>

  <!-- Header Section -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="4" height="42" fill="url(#accentBlue)" rx="2" />
    <text x="16" y="24" class="title">Twitter &amp; Pixiv AI 智慧標籤圖庫系統 · 系統架構圖</text>
    <text x="16" y="42" class="subtitle">System Architecture Diagram: Full-Stack Pipeline with AI Vision, Reverse Search &amp; MCP Integration</text>
  </g>

  <!-- ==================== LAYER 1: PRESENTATION & CLIENT LAYER ==================== -->
  <g transform="translate(45, 115)">
    <!-- Layer Frame -->
    <rect width="1060" height="115" rx="12" fill="url(#layerGrad1)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="24" y="32" class="layer-header" fill="#38bdf8">01 / 使用者介面與外部整合層 (PRESENTATION &amp; INTEGRATION LAYER)</text>

    <!-- Card 1: Web UI SPA -->
    <g transform="translate(24, 45)">
      <rect width="500" height="55" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="25" cy="27" r="14" fill="#1e3a8a" />
      <path d="M19 27 L23 31 L31 23" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="24" class="card-title">現代化 SPA 單頁 Web 前端 (static/index.html)</text>
      <text x="50" y="42" class="card-desc">虛擬化瀑布流 · 複合標籤篩選(+/-) · 快速全解析度檢視 · 鍵盤導航操作</text>
    </g>

    <!-- Card 2: MCP Server Interface -->
    <g transform="translate(540, 45)">
      <rect width="496" height="55" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="25" cy="27" r="14" fill="#581c87" />
      <path d="M21 21 L29 27 L21 33" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="50" y="24" class="card-title">Model Context Protocol (mcp_server.py)</text>
      <text x="50" y="42" class="card-desc">Claude Desktop / Gemini Flash / Antigravity Agents · 10+ 圖庫維護工具</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <path d="M 319 230 L 319 265" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <path d="M 833 230 L 833 265" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- ==================== LAYER 2: API GATEWAY & ORCHESTRATION ==================== -->
  <g transform="translate(45, 270)">
    <rect width="1060" height="120" rx="12" fill="url(#layerGrad1)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="24" y="32" class="layer-header" fill="#34d399">02 / 核心服務與調度層 (API GATEWAY &amp; ORCHESTRATION LAYER)</text>

    <!-- Card 3: FastAPI REST Server -->
    <g transform="translate(24, 45)">
      <rect width="500" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="25" cy="30" r="14" fill="#064e3b" />
      <path d="M20 30 H30 M25 25 V35" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="26" class="card-title">FastAPI 後端 API 服務 (app.py:8765)</text>
      <text x="50" y="46" class="card-desc">REST Endpoints (/api/images, /api/tags, /api/reverse-search, /api/rename)</text>
    </g>

    <!-- Card 4: Background Scheduler -->
    <g transform="translate(540, 45)">
      <rect width="496" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="25" cy="30" r="14" fill="#78350f" />
      <circle cx="25" cy="30" r="6" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
      <path d="M25 27 V30 L27 31" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
      <text x="50" y="26" class="card-title">背景監控與排程器 (scheduler.py / start_background.pyw)</text>
      <text x="50" y="46" class="card-desc">增量掃描 · 縮圖非同步快取佇列 · 多執行緒無鎖檔案監控</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <path d="M 319 390 L 319 425" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
  <path d="M 833 390 L 833 425" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== LAYER 3: CORE PROCESSING ENGINES ==================== -->
  <g transform="translate(45, 430)">
    <rect width="1060" height="135" rx="12" fill="url(#layerGrad1)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="24" y="32" class="layer-header" fill="#fbbf24">03 / 核心業務與分析引擎 (CORE PROCESSING ENGINES)</text>

    <!-- Sub-engine 1: Semantic Engine -->
    <g transform="translate(24, 45)">
      <rect width="240" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="25" class="card-title" fill="#f8fafc">語意檢索引擎</text>
      <text x="16" y="43" class="card-desc">semantic_engine.py</text>
      <text x="16" y="60" class="card-desc">Jaccard 共現矩陣 · 語意擴展</text>
    </g>

    <!-- Sub-engine 2: Chinese Dictionary -->
    <g transform="translate(280, 45)">
      <rect width="244" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="25" class="card-title" fill="#f8fafc">繁中字典與在地化</text>
      <text x="16" y="43" class="card-desc">zh_dict.py</text>
      <text x="16" y="60" class="card-desc">10,000+ 標籤雙語對照 · 畫師資料夾</text>
    </g>

    <!-- Sub-engine 3: Safe Renamer -->
    <g transform="translate(540, 45)">
      <rect width="240" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="25" class="card-title" fill="#f8fafc">安全重命名與還原</text>
      <text x="16" y="43" class="card-desc">renamer.py</text>
      <text x="16" y="60" class="card-desc">Windows 自然排序 · 1鍵 Undo</text>
    </g>

    <!-- Sub-engine 4: Decensor Engine -->
    <g transform="translate(796, 45)">
      <rect width="240" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="25" class="card-title" fill="#f8fafc">去馬賽克修復引擎</text>
      <text x="16" y="43" class="card-desc">decensor_engine.py</text>
      <text x="16" y="60" class="card-desc">YOLOv8 遮罩 + DeepCreamPy</text>
    </g>
  </g>

  <!-- Connectors Layer 3 -> Layer 4 -->
  <path d="M 575 565 L 575 600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== LAYER 4: AI & REVERSE SEARCH PIPELINES ==================== -->
  <g transform="translate(45, 605)">
    <rect width="1060" height="150" rx="12" fill="url(#layerGrad1)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="24" y="30" class="layer-header" fill="#f43f5e">04 / AI 視覺打標與多重反查校正層 (AI VISION &amp; REVERSE SEARCH PIPELINES)</text>

    <!-- Pipeline Box A: Local AI Vision -->
    <g transform="translate(24, 45)">
      <rect width="500" height="90" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1.2" />
      <text x="18" y="26" class="card-title">本機神經網路視覺打標 (ai_tagger.py / fast_bulk_artist_tagger.py)</text>
      <text x="18" y="48" class="card-desc">· Camie Tagger v2 (ViT ONNX) · 70,527 Danbooru 標籤 · 7,007 位畫師風格識別</text>
      <text x="18" y="68" class="card-desc">· 支援 DirectML (AMD Radeon RX 9070 XT) 與 CUDA 硬體推論加速</text>
    </g>

    <!-- Pipeline Box B: Reverse Search & Calibration -->
    <g transform="translate(540, 45)">
      <rect width="496" height="90" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="18" y="26" class="card-title">多來源以圖搜圖與標籤校正鏈 (reverse_search.py)</text>
      <text x="18" y="48" class="card-desc">1. Danbooru MD5 零頻寬精準雜湊比對 (100% 官方認證畫師 / Twitter @ / Pixiv ID)</text>
      <text x="18" y="66" class="card-desc">2. IQDB 視覺特徵比對 · 3. SauceNAO API · 4. 自動標籤校正 (清除 AI 低信心度誤判)</text>
    </g>
  </g>

  <!-- Connectors Layer 4 -> Layer 5 -->
  <path d="M 575 755 L 575 790" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== LAYER 5: STORAGE & PERSISTENCE ==================== -->
  <g transform="translate(45, 795)">
    <rect width="1060" height="120" rx="12" fill="url(#layerGrad1)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="24" y="30" class="layer-header" fill="#94a3b8">05 / 儲存與持久化層 (DATA STORAGE &amp; PERSISTENCE LAYER)</text>

    <!-- Storage Item 1: Raw Image Files -->
    <g transform="translate(24, 45)">
      <rect width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" class="card-title">本地圖庫目錄</text>
      <text x="14" y="42" class="card-desc">D:\圖檔\twitter (31,000+ 圖檔)</text>
    </g>

    <!-- Storage Item 2: SQLite DB -->
    <g transform="translate(280, 45)">
      <rect width="244" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="24" class="card-title">SQLite 資料庫 (WAL 模式)</text>
      <text x="14" y="42" class="card-desc">.tag_gallery/gallery.db (正規化關聯)</text>
    </g>

    <!-- Storage Item 3: Thumbnail Cache -->
    <g transform="translate(540, 45)">
      <rect width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" class="card-title">縮圖非同步快取</text>
      <text x="14" y="42" class="card-desc">.tag_gallery/thumbs/ (WebP/JPEG)</text>
    </g>

    <!-- Storage Item 4: Model & Transaction History -->
    <g transform="translate(796, 45)">
      <rect width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" class="card-title">模型權重與交易 Log</text>
      <text x="14" y="42" class="card-desc">ONNX Weights / rename_history.json</text>
    </g>
  </g>
</svg>
